# Copie para "airflow-secrets.yaml" (no .gitignore) e preencha. Aplicar ANTES
# do helm install. Os valores devem ser os MESMOS do .env -- ver o aviso no
# topo do .env.example.
#
# Nas duas URIs, se a senha tiver caractere especial (@ : / ? #), ela precisa
# ir URL-encoded -- senha alfanumerica vai literal. A chave
# "connection" do ultimo Secret tem esse nome porque e o formato exigido pelo
# chart quando data.metadataSecretName e usado -- nao renomeie.
#
# O AIRFLOW_CONN_BANVIC_DEST chega ao pod de CADA task via `extraEnvFrom` do
# chart, e e lido por dags/utils/validations.py com BaseHook.get_connection.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-webserver-secret
  namespace: banvic
type: Opaque
stringData:
  webserver-secret-key: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-connections-secret
  namespace: banvic
type: Opaque
stringData:
  AIRFLOW_CONN_BANVIC_DEST: "postgresql://CHANGE_ME:CHANGE_ME@postgres.banvic.svc.cluster.local:5432/banvic_dw"
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-metadata-db
  namespace: banvic
type: Opaque
stringData:
  connection: "postgresql://CHANGE_ME:CHANGE_ME@postgres.banvic.svc.cluster.local:5432/airflow_metadata"
