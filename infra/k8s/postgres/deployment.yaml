apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: banvic
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          # Via "sh -c" de proposito. O Kubernetes expande $(VAR) apenas em
          # valores de env, em command e em args -- NAO em exec.command de
          # probe. Escrito como ["pg_isready", "-U", "$(POSTGRES_USER)"], o
          # pg_isready receberia a string literal "$(POSTGRES_USER)" como
          # usuario. Nao quebrava, porque pg_isready checa se o servidor aceita
          # conexoes e nao autentica -- ou seja, a probe funcionava por acidente.
          # Com o shell, $POSTGRES_USER e expandido a partir do envFrom acima.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
