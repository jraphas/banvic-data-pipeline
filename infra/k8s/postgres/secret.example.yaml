# Copie para "secret.yaml" (no .gitignore) e preencha. Os valores devem ser os
# MESMOS do .env -- ver o aviso no topo do .env.example.
#
# Os dois blocos abaixo sao o mesmo banco com duas convencoes de nome, porque
# ha dois consumidores: POSTGRES_* inicializa o container postgres:16-alpine,
# e TARGET_POSTGRES_* e o que o Meltano resolve no meltano.yml.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: banvic
type: Opaque
stringData:
  POSTGRES_USER: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "banvic_dw"

  TARGET_POSTGRES_HOST: "postgres.banvic.svc.cluster.local"
  TARGET_POSTGRES_PORT: "5432"
  TARGET_POSTGRES_USER: "CHANGE_ME"
  TARGET_POSTGRES_PASSWORD: "CHANGE_ME"
  TARGET_POSTGRES_DB: "banvic_dw"
