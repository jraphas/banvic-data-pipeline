requires_meltano: '>=4.2.2,<5.0.0'
default_environment: k8s
project_id: banvic-data-pipeline

environments:
- name: k8s
  env:
    BANVIC_DATA_DIR: /project/data

plugins:
  extractors:
  - name: tap-csv
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-csv.git
    config:
      add_metadata_columns: true
      files:
      - entity: agencias
        path: ${BANVIC_DATA_DIR}/agencias.csv
        keys: [cod_agencia]
      - entity: clientes
        path: ${BANVIC_DATA_DIR}/clientes.csv
        keys: [cod_cliente]
      - entity: colaborador_agencia
        path: ${BANVIC_DATA_DIR}/colaborador_agencia.csv
        keys: [cod_colaborador, cod_agencia]
      - entity: colaboradores
        path: ${BANVIC_DATA_DIR}/colaboradores.csv
        keys: [cod_colaborador]
      - entity: contas
        path: ${BANVIC_DATA_DIR}/contas.csv
        keys: [num_conta]
      - entity: propostas_credito
        path: ${BANVIC_DATA_DIR}/propostas_credito.csv
        keys: [cod_proposta]
      - entity: transacoes
        path: ${BANVIC_DATA_DIR}/transacoes.csv
        keys: [cod_transacao]

      stream_maps:
        agencias:
          cod_agencia: "int(cod_agencia) if cod_agencia not in (None, '') else None"
        clientes:
          cod_cliente: "int(cod_cliente) if cod_cliente not in (None, '') else None"
          data_inclusao: "datetime.datetime.strptime(data_inclusao, '%Y-%m-%d %H:%M:%S.%f %Z' if '.' in data_inclusao else '%Y-%m-%d %H:%M:%S %Z').replace(tzinfo=datetime.timezone.utc).isoformat() if data_inclusao not in (None, '') else None"
        colaborador_agencia:
          cod_colaborador: "int(cod_colaborador) if cod_colaborador not in (None, '') else None"
          cod_agencia: "int(cod_agencia) if cod_agencia not in (None, '') else None"
        colaboradores:
          cod_colaborador: "int(cod_colaborador) if cod_colaborador not in (None, '') else None"
        contas:
          num_conta: "int(num_conta) if num_conta not in (None, '') else None"
          cod_cliente: "int(cod_cliente) if cod_cliente not in (None, '') else None"
          cod_agencia: "int(cod_agencia) if cod_agencia not in (None, '') else None"
          cod_colaborador: "int(cod_colaborador) if cod_colaborador not in (None, '') else None"
          saldo_total: "float(saldo_total) if saldo_total not in (None, '') else None"
          saldo_disponivel: "float(saldo_disponivel) if saldo_disponivel not in (None, '') else None"
          data_abertura: "datetime.datetime.strptime(data_abertura, '%Y-%m-%d %H:%M:%S.%f %Z' if '.' in data_abertura else '%Y-%m-%d %H:%M:%S %Z').replace(tzinfo=datetime.timezone.utc).isoformat() if data_abertura not in (None, '') else None"
          data_ultimo_lancamento: "datetime.datetime.strptime(data_ultimo_lancamento, '%Y-%m-%d %H:%M:%S.%f %Z' if '.' in data_ultimo_lancamento else '%Y-%m-%d %H:%M:%S %Z').replace(tzinfo=datetime.timezone.utc).isoformat() if data_ultimo_lancamento not in (None, '') else None"
        propostas_credito:
          cod_proposta: "int(cod_proposta) if cod_proposta not in (None, '') else None"
          cod_cliente: "int(cod_cliente) if cod_cliente not in (None, '') else None"
          cod_colaborador: "int(cod_colaborador) if cod_colaborador not in (None, '') else None"
          quantidade_parcelas: "int(quantidade_parcelas) if quantidade_parcelas not in (None, '') else None"
          carencia: "int(carencia) if carencia not in (None, '') else None"
          taxa_juros_mensal: "float(taxa_juros_mensal) if taxa_juros_mensal not in (None, '') else None"
          valor_proposta: "float(valor_proposta) if valor_proposta not in (None, '') else None"
          valor_financiamento: "float(valor_financiamento) if valor_financiamento not in (None, '') else None"
          valor_entrada: "float(valor_entrada) if valor_entrada not in (None, '') else None"
          valor_prestacao: "float(valor_prestacao) if valor_prestacao not in (None, '') else None"
          data_entrada_proposta: "datetime.datetime.strptime(data_entrada_proposta, '%Y-%m-%d %H:%M:%S.%f %Z' if '.' in data_entrada_proposta else '%Y-%m-%d %H:%M:%S %Z').replace(tzinfo=datetime.timezone.utc).isoformat() if data_entrada_proposta not in (None, '') else None"
        transacoes:
          cod_transacao: "int(cod_transacao) if cod_transacao not in (None, '') else None"
          num_conta: "int(num_conta) if num_conta not in (None, '') else None"
          valor_transacao: "float(valor_transacao) if valor_transacao not in (None, '') else None"
          data_transacao: "datetime.datetime.strptime(data_transacao, '%Y-%m-%d %H:%M:%S.%f %Z' if '.' in data_transacao else '%Y-%m-%d %H:%M:%S %Z').replace(tzinfo=datetime.timezone.utc).isoformat() if data_transacao not in (None, '') else None"

    schema:
      agencias:
        cod_agencia:
          type: integer
        data_abertura:
          type: string
          format: date
      clientes:
        cod_cliente:
          type: integer
        data_inclusao:
          type: string
          format: date-time
        data_nascimento:
          type: string
          format: date
      colaborador_agencia:
        cod_colaborador:
          type: integer
        cod_agencia:
          type: integer
      colaboradores:
        cod_colaborador:
          type: integer
        data_nascimento:
          type: string
          format: date
      contas:
        num_conta:
          type: integer
        cod_cliente:
          type: integer
        cod_agencia:
          type: integer
        cod_colaborador:
          type: integer
        data_abertura:
          type: string
          format: date-time
        data_ultimo_lancamento:
          type: string
          format: date-time
        saldo_total:
          type: number
        saldo_disponivel:
          type: number
      propostas_credito:
        cod_proposta:
          type: integer
        cod_cliente:
          type: integer
        cod_colaborador:
          type: integer
        quantidade_parcelas:
          type: integer
        carencia:
          type: integer
        taxa_juros_mensal:
          type: number
        valor_proposta:
          type: number
        valor_financiamento:
          type: number
        valor_entrada:
          type: number
        valor_prestacao:
          type: number
        data_entrada_proposta:
          type: string
          format: date-time
      transacoes:
        cod_transacao:
          type: integer
        num_conta:
          type: integer
        data_transacao:
          type: string
          format: date-time
        valor_transacao:
          type: number

  loaders:
  - name: target-postgres
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/target-postgres.git
    config:
      host: ${TARGET_POSTGRES_HOST}
      port: ${TARGET_POSTGRES_PORT}
      user: ${TARGET_POSTGRES_USER}
      password: ${TARGET_POSTGRES_PASSWORD}
      database: ${TARGET_POSTGRES_DB}
      default_target_schema: raw_banvic
      load_method: upsert
      add_record_metadata_columns: true

jobs:
- name: banvic_full_ingestion
  tasks:
  - tap-csv target-postgres